[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoprep"
version = "0.2.0"
description = "A small, local-first photo preparation workspace for macOS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "sirdimitry"}]
dependencies = ["PySide6>=6.8,<7", "numpy>=2.0,<3", "onnxruntime>=1.23,<2", "certifi>=2025.1", "Pillow>=13,<14"]
keywords = ["photos", "image editor", "crop", "inpainting", "macos"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: MacOS :: MacOS X"]

[project.scripts]
photoprep = "photoprep.main:main"

[tool.setuptools]
packages = ["photoprep", "photoprep.ui"]

[project.optional-dependencies]
sdxl = ["torch>=2.6,<3", "diffusers>=0.35,<1", "transformers>=4.45,<5", "accelerate>=1,<2", "safetensors>=0.4,<1", "huggingface-hub>=0.34,<1"]
dev = ["pytest>=8", "Pillow>=10", "pyinstaller>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

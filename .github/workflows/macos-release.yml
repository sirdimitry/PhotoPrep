name: macOS alpha release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Test source
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Build macOS application and DMG
        run: bash scripts/build_macos.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPrep-macos-alpha
          path: |
            dist/*.dmg
            dist/*.sha256
      - name: Publish tagged prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.sha256

name: macOS checks and build

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/python/requirements-build.txt
      - name: Install verified dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-deps -e .
      - name: Test source
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build macOS application and DMG
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/build_macos.sh
      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPrep-python-macos
          path: |
            apps/python/dist/*.dmg
            apps/python/dist/*.sha256

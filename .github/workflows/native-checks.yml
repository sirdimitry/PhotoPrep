name: Native checks
on:
  push:
    branches: [main, 'native/**']
    paths: ['apps/native/**', '.github/workflows/native-checks.yml']
  pull_request:
    paths: ['apps/native/**', '.github/workflows/native-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test memory admission and oriented preview
        working-directory: apps/native
        run: swift test --scratch-path work/swift-tests
      - name: Build native development app
        run: >-
          xcodebuild -project apps/native/PhotoPrepNative.xcodeproj
          -scheme PhotoPrepNative -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath work/native-build build CODE_SIGNING_ALLOWED=NO
      - name: Check developer benchmark syntax
        run: python3 -c "import ast,pathlib; ast.parse(pathlib.Path('apps/native/Tools/quality_benchmark.py').read_text())"
